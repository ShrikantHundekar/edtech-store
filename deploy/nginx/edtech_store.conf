# ==============================================================================
# Nginx Configuration for EdTech Store Media Protection
# Enforces raw URL restrictions and internal-only protected file serving
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Public static assets
    location /static/ {
        alias /var/www/edtech_store/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Public general media (e.g. course icons, UI avatars)
    location /media/ {
        alias /var/www/edtech_store/media/;
        expires 7d;
    }

    # SECURITY BARRIER: Explicitly forbid any direct static access to study notes
    location /media/notes/ {
        return 403 "Direct access to educational notes is forbidden. Use streaming endpoints.\n";
    }

    location /media/materials/ {
        return 403 "Direct access to study materials is forbidden. Use streaming endpoints.\n";
    }

    # PROTECTED MEDIA ROOT: Internal only
    # Cannot be fetched by direct external client request; only served via authorized backend proxy (X-Accel-Redirect)
    location /protected_media/ {
        internal;
        alias /var/www/edtech_store/protected_media/;
    }

    # Upstream proxy to Django application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
